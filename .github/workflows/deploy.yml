name: Staging deploy
# UITGESCHAKELD 2026-10-01: publieke Pages-deploy per push is in strijd met
# "niet live zonder expliciete ja". Alleen nog handmatig te starten.
# Staging loopt via new.powerland.be achter Cloudflare Access (zie tasks/staging-upload.md).
on:
  workflow_dispatch:
concurrency:
  group: staging
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
