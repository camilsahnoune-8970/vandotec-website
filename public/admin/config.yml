backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: public/img
public_folder: /img

collections:
  - name: "pages"
    label: "Pagina's"
    files:
      - name: "home"
        label: "Homepage"
        file: "src/data/home.json"
        preview:
          placeholder: "/img/hero-bg.svg"
        fields:
          - { label: "Paginatitel", name: "title", widget: "string" }
          - { label: "Meta description", name: "description", widget: "string" }
          - { label: "Hero titel", name: "hero_title", widget: "string" }
          - { label: "Hero subtitel", name: "hero_subtitle", widget: "text" }
          - { label: "About titel", name: "about_title", widget: "string" }
          - { label: "About paragrafen", name: "about_paragraphs", widget: "list", field: { label: "Paragraaf", name: "paragraph", widget: "text" } }
          - { label: "About linklabel", name: "about_link_label", widget: "string" }
          - { label: "Expertises titel", name: "expertises_title", widget: "string" }
          - { label: "Expertises subtitel", name: "expertises_subtitle", widget: "text" }
          - { label: "Expertises knoplabel", name: "expertises_cta_label", widget: "string" }
          - { label: "Expertises blokken", name: "expertises_sections", widget: "list", field: { label: "Expertise", name: "expertise", widget: "object", fields: [{ label: "Slug", name: "slug", widget: "string" }, { label: "Icoon", name: "icon", widget: "string" }, { label: "Titel", name: "title", widget: "string" }, { label: "Samenvatting", name: "summary", widget: "text" }, { label: "Uitgebreide tekst", name: "body", widget: "list", field: { label: "Paragraaf", name: "paragraph", widget: "text" } }, { label: "Aanpak titel", name: "approach_title", widget: "string" }, { label: "Aanpak", name: "approach", widget: "list", field: { label: "Paragraaf", name: "paragraph", widget: "text" } }] } }
          - { label: "Services titel", name: "services_title", widget: "string" }
          - { label: "Services subtitel", name: "services_subtitle", widget: "text" }
          - { label: "Services", name: "services", widget: "list", field: { label: "Service", name: "service", widget: "object", fields: [{ label: "Titel", name: "title", widget: "string" }, { label: "Tekst", name: "text", widget: "text" }] } }
          - { label: "Proces titel", name: "process_title", widget: "string" }
          - { label: "Proces subtitel", name: "process_subtitle", widget: "text" }
          - { label: "Processtappen", name: "process_items", widget: "list", field: { label: "Stap", name: "step", widget: "object", fields: [{ label: "Titel", name: "title", widget: "string" }, { label: "Tekst", name: "text", widget: "text" }] } }
          - { label: "Stats", name: "stats", widget: "list", field: { label: "Stat", name: "stat", widget: "object", fields: [{ label: "Getal", name: "number", widget: "string" }, { label: "Label", name: "label", widget: "string" }] } }
          - { label: "Call-to-actions", name: "ctas", widget: "list", field: { label: "CTA", name: "cta", widget: "object", fields: [{ label: "Label", name: "label", widget: "string" }, { label: "Link", name: "url", widget: "string" }, { label: "Thema", name: "theme", widget: "string" }, { label: "Tekst", name: "text", widget: "string" }, { label: "Beschrijving", name: "description", widget: "text" }] } }

      - name: "contact"
        label: "Contact"
        file: "src/data/contact.json"
        fields:
          - { label: "Paginatitel", name: "title", widget: "string" }
          - { label: "Meta description", name: "description", widget: "string" }
          - { label: "Hero titel", name: "hero_title", widget: "string" }
          - { label: "Hero subtitel", name: "hero_subtitle", widget: "text" }
          - { label: "Bedrijfsnaam", name: "company", widget: "string" }
          - { label: "Adresregels", name: "address_lines", widget: "list", field: { label: "Adres", name: "line", widget: "string" } }
          - { label: "BTW-nummer", name: "vat", widget: "string" }
          - { label: "Telefoonnummer", name: "phone", widget: "string" }
          - { label: "Telefoon weergave", name: "phone_display", widget: "string" }
          - { label: "E-mailadres", name: "email", widget: "string" }
          - { label: "Interventie titel", name: "intervention_title", widget: "string" }
          - { label: "Interventietekst", name: "intervention_text", widget: "text" }
          - { label: "Formuliertitel", name: "form_title", widget: "string" }
          - { label: "Formulieropmerking", name: "form_note", widget: "text" }
          - { label: "Stats", name: "stats", widget: "list", field: { label: "Stat", name: "stat", widget: "object", fields: [{ label: "Getal", name: "number", widget: "string" }, { label: "Label", name: "label", widget: "string" }] } }
          - { label: "Call-to-actions", name: "ctas", widget: "list", field: { label: "CTA", name: "cta", widget: "object", fields: [{ label: "Label", name: "label", widget: "string" }, { label: "Link", name: "url", widget: "string" }, { label: "Thema", name: "theme", widget: "string" }, { label: "Tekst", name: "text", widget: "string" }, { label: "Beschrijving", name: "description", widget: "text" }] } }

      - name: "expertises"
        label: "Expertises"
        file: "src/data/expertises.json"
        fields:
          - { label: "Paginatitel", name: "title", widget: "string" }
          - { label: "Meta description", name: "description", widget: "string" }
          - { label: "Hero titel", name: "hero_title", widget: "string" }
          - { label: "Hero subtitel", name: "hero_subtitle", widget: "text" }
          - { label: "Expertisesecties", name: "sections", widget: "list", field: { label: "Sectie", name: "section", widget: "object", fields: [{ label: "Slug", name: "slug", widget: "string" }, { label: "Icoonpad", name: "icon", widget: "string" }, { label: "Titel", name: "title", widget: "string" }, { label: "Samenvatting", name: "summary", widget: "text" }, { label: "Uitgebreide tekst", name: "body", widget: "list", field: { label: "Paragraaf", name: "paragraph", widget: "text" } }, { label: "Aanpak titel", name: "approach_title", widget: "string" }, { label: "Aanpak", name: "approach", widget: "list", field: { label: "Paragraaf", name: "paragraph", widget: "text" } }] } }
          - { label: "Stats", name: "stats", widget: "list", field: { label: "Stat", name: "stat", widget: "object", fields: [{ label: "Getal", name: "number", widget: "string" }, { label: "Label", name: "label", widget: "string" }] } }
          - { label: "Call-to-actions", name: "ctas", widget: "list", field: { label: "CTA", name: "cta", widget: "object", fields: [{ label: "Label", name: "label", widget: "string" }, { label: "Link", name: "url", widget: "string" }, { label: "Thema", name: "theme", widget: "string" }, { label: "Tekst", name: "text", widget: "string" }, { label: "Beschrijving", name: "description", widget: "text" }] } }

      - name: "jobs"
        label: "Jobs"
        file: "src/data/jobs.json"
        fields:
          - { label: "Paginatitel", name: "title", widget: "string" }
          - { label: "Meta description", name: "description", widget: "string" }
          - { label: "Hero titel", name: "hero_title", widget: "string" }
          - { label: "Hero subtitel", name: "hero_subtitle", widget: "text" }
          - { label: "Waarom-titel", name: "why_title", widget: "string" }
          - { label: "Waarom-teksten", name: "why_paragraphs", widget: "list", field: { label: "Paragraaf", name: "paragraph", widget: "text" } }
          - { label: "Voordelen titel", name: "benefits_title", widget: "string" }
          - { label: "Voordelen", name: "benefits", widget: "list", field: { label: "Voordeel", name: "item", widget: "string" } }
          - { label: "Vacaturekop", name: "open_roles_title", widget: "string" }
          - { label: "Vacaturetekst", name: "open_roles_text", widget: "text" }
          - { label: "Call-to-actions", name: "ctas", widget: "list", field: { label: "CTA", name: "cta", widget: "object", fields: [{ label: "Label", name: "label", widget: "string" }, { label: "Link", name: "url", widget: "string" }, { label: "Thema", name: "theme", widget: "string" }, { label: "Tekst", name: "text", widget: "string" }, { label: "Beschrijving", name: "description", widget: "text" }] } }

      - name: "over-vandotec"
        label: "Over Vandotec"
        file: "src/data/over-vandotec.json"
        fields:
          - { label: "Paginatitel", name: "title", widget: "string" }
          - { label: "Meta description", name: "description", widget: "string" }
          - { label: "Hero titel", name: "hero_title", widget: "string" }
          - { label: "Hero subtitel", name: "hero_subtitle", widget: "text" }
          - { label: "Intro titel", name: "intro_title", widget: "string" }
          - { label: "Introteksten", name: "intro_paragraphs", widget: "list", field: { label: "Paragraaf", name: "paragraph", widget: "text" } }
          - { label: "Stats titel", name: "stats_title", widget: "string" }
          - { label: "Stats kerncijfers", name: "stats", widget: "list", field: { label: "Kerncijfer", name: "stat", widget: "object", fields: [{ label: "Getal", name: "number", widget: "string" }, { label: "Label", name: "label", widget: "string" }] } }
          - { label: "Waarden titel", name: "values_title", widget: "string" }
          - { label: "Waarden", name: "values", widget: "list", field: { label: "Waarde", name: "value", widget: "object", fields: [{ label: "Titel", name: "title", widget: "string" }, { label: "Tekst", name: "text", widget: "text" }] } }
          - { label: "Proces titel", name: "process_title", widget: "string" }
          - { label: "Proces intro", name: "process_intro", widget: "text" }
          - { label: "Processtappen", name: "process_items", widget: "list", field: { label: "Stap", name: "step", widget: "object", fields: [{ label: "Titel", name: "title", widget: "string" }, { label: "Tekst", name: "text", widget: "text" }] } }
          - { label: "Call-to-actions", name: "ctas", widget: "list", field: { label: "CTA", name: "cta", widget: "object", fields: [{ label: "Label", name: "label", widget: "string" }, { label: "Link", name: "url", widget: "string" }, { label: "Thema", name: "theme", widget: "string" }, { label: "Tekst", name: "text", widget: "string" }, { label: "Beschrijving", name: "description", widget: "text" }] } }

      - name: "service-onderhoud"
        label: "Service & Onderhoud"
        file: "src/data/service-onderhoud.json"
        fields:
          - { label: "Paginatitel", name: "title", widget: "string" }
          - { label: "Meta description", name: "description", widget: "string" }
          - { label: "Hero titel", name: "hero_title", widget: "string" }
          - { label: "Hero subtitel", name: "hero_subtitle", widget: "text" }
          - { label: "Services", name: "sections", widget: "list", field: { label: "Service", name: "section", widget: "object", fields: [{ label: "Slug", name: "slug", widget: "string" }, { label: "Afbeelding", name: "image", widget: "string" }, { label: "Titel", name: "title", widget: "string" }, { label: "Intro", name: "intro", widget: "text" }, { label: "Details", name: "details", widget: "text" }, { label: "Highlights titel", name: "highlights_title", widget: "string" }, { label: "Highlights", name: "highlights", widget: "list", field: { label: "Punt", name: "item", widget: "string" } }] } }
          - { label: "Call-to-actions", name: "ctas", widget: "list", field: { label: "CTA", name: "cta", widget: "object", fields: [{ label: "Label", name: "label", widget: "string" }, { label: "Link", name: "url", widget: "string" }, { label: "Thema", name: "theme", widget: "string" }, { label: "Tekst", name: "text", widget: "string" }, { label: "Beschrijving", name: "description", widget: "text" }] } }
